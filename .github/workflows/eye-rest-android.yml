name: Eye Rest Android APK

on:
  push:
    paths:
      - 'eye-rest/**'
      - '.github/workflows/eye-rest-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eye-rest-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eye-rest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk eye-rest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eye-rest-apk
          path: eye-rest/eye-rest.apk

      # 固定的下載網址：/releases/download/eye-rest-latest/eye-rest.apk
      - name: Publish to release "eye-rest-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete eye-rest-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create eye-rest-latest eye-rest.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "護眼提醒 Android APK（build ${{ github.run_number }}）" \
            --notes "在手機上下載 eye-rest.apk 安裝即可。來源 commit：${GITHUB_SHA::7}（${GITHUB_REF_NAME}）。"
